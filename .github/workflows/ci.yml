name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # next-env.d.ts (image module declarations) and .next/types (LayoutProps,
      # route types) are generated by Next.js and not committed, so a fresh
      # checkout has neither — generate them before running tsc.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_SUPABASE_URL: ${{ secrets.NEXT_SUPABASE_URL }}
          NEXT_SUPABASE_ANON_KEY: ${{ secrets.NEXT_SUPABASE_ANON_KEY }}
          NEXT_SITE_URL: https://staging.example.com
